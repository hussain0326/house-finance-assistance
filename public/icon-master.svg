<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="eGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- app icon background: same color as the app's primary button -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#4f46e5"/>

  <!-- orbit ring accent, passing behind the receipt -->
  <ellipse cx="256" cy="286" rx="204" ry="66" transform="rotate(-14 256 286)"
           fill="none" stroke="url(#orbitGrad)" stroke-width="6" opacity="0.55"/>

  <!-- sparkle accent -->
  <path d="M112 176 l10 24 l24 10 l-24 10 l-10 24 l-10 -24 l-24 -10 l24 -10 z" fill="#5eead4" opacity="0.9"/>

  <!-- receipt card -->
  <path d="M144 88
           h176
           a16 16 0 0 1 16 16
           v256
           l-14 -12 l-14 12 l-14 -12 l-14 12 l-14 -12 l-14 12 l-14 -12 l-14 12 l-14 -12 l-14 12 l-14 -12 l-14 12
           v-244
           a16 16 0 0 1 16 -16 z"
        fill="#f8fafc"/>

  <!-- E monogram (built from rectangles so it renders identically everywhere) -->
  <g fill="url(#eGrad)">
    <rect x="168" y="126" width="60" height="20" rx="6"/>
    <rect x="168" y="126" width="20" height="100" rx="6"/>
    <rect x="168" y="166" width="48" height="20" rx="6"/>
    <rect x="168" y="206" width="60" height="20" rx="6"/>
  </g>

  <!-- mini bar chart -->
  <g fill="url(#barGrad)">
    <rect x="248" y="180" width="18" height="46" rx="4"/>
    <rect x="274" y="156" width="18" height="70" rx="4"/>
    <rect x="300" y="134" width="18" height="92" rx="4"/>
  </g>

  <!-- mini pie chart -->
  <g>
    <circle cx="198" cy="290" r="32" fill="url(#barGrad)"/>
    <path d="M198 290 L198 258 A32 32 0 0 1 227 306 Z" fill="url(#eGrad)"/>
  </g>

  <!-- line-item placeholders -->
  <g fill="#cbd5e1">
    <rect x="246" y="256" width="76" height="11" rx="5.5"/>
    <rect x="246" y="278" width="60" height="11" rx="5.5"/>
    <rect x="246" y="300" width="70" height="11" rx="5.5"/>
  </g>

  <!-- assistant chat bubble accent -->
  <g>
    <path d="M330 296
             a28 28 0 0 1 28 -28
             h56
             a28 28 0 0 1 28 28
             v24
             a28 28 0 0 1 -28 28
             h-30
             l-18 20
             v-20
             h-8
             a28 28 0 0 1 -28 -28 z"
          fill="#f8fafc"/>
    <circle cx="358" cy="308" r="6" fill="url(#eGrad)"/>
    <circle cx="380" cy="308" r="6" fill="url(#eGrad)"/>
    <circle cx="402" cy="308" r="6" fill="url(#eGrad)"/>
  </g>
</svg>
