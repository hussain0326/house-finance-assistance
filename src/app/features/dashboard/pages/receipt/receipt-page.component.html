<mat-card appearance="outlined" class="scan-card p-4">
  <div class="card-head">
    <div class="head-icon">
      <mat-icon>upload_file</mat-icon>
    </div>
    <div>
      <h2 class="m-0 text-xl font-semibold">Upload Receipt</h2>
      <p class="mt-1 text-slate-600">
        Supported files: JPG, JPEG, PNG, PDF. Uploaded files are stored in private Supabase storage
        and linked to the receipts table.
      </p>
    </div>
  </div>

  <div class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center">
    <input #fileInput type="file" accept=".jpg,.jpeg,.png,.pdf" class="hidden" (change)="onFileSelected($event)" aria-label="Select receipt file" />

    <button mat-stroked-button color="primary" type="button" class="!h-11 !rounded-xl !px-4" (click)="fileInput.click()">
      Choose Receipt File
    </button>

    <p class="text-sm text-slate-600" *ngIf="selectedFile(); else noFile">{{ selectedFile()!.name }}</p>
    <ng-template #noFile>
      <p class="text-sm text-slate-500">No file selected</p>
    </ng-template>

    <button
      mat-flat-button
      color="primary"
      type="button"
      [disabled]="isUploading() || !selectedFile()"
      (click)="uploadSelected()"
    >
      <span class="inline-flex items-center gap-2">
        <mat-spinner *ngIf="isUploading()" diameter="16"></mat-spinner>
        Upload Receipt
      </span>
    </button>
  </div>

  @if (uploadMessage()) {
    <div
      class="mt-3 flex items-center gap-2 rounded-lg px-3 py-2 text-sm"
      [class.bg-emerald-50]="uploadSuccess()"
      [class.text-emerald-700]="uploadSuccess()"
      [class.bg-red-50]="!uploadSuccess()"
      [class.text-red-700]="!uploadSuccess()"
      aria-live="polite"
    >
      <span>{{ uploadSuccess() ? '✓' : '!' }}</span>
      <span>{{ uploadMessage() }}</span>
    </div>
  }
</mat-card>
