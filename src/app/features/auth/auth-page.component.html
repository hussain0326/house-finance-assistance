<main class="auth-bg min-h-screen p-4 sm:p-8">
  <section class="mx-auto flex min-h-[calc(100vh-2rem)] w-full max-w-5xl items-center justify-center sm:min-h-[calc(100vh-4rem)]">
    <mat-card class="auth-card w-full max-w-md rounded-3xl p-3 sm:p-5" appearance="outlined">
      <mat-card-header>
        <mat-card-title class="auth-title !text-2xl !font-semibold tracking-tight">
          <mat-icon>{{ authIcon() }}</mat-icon>
          <span>{{ heading() }}</span>
        </mat-card-title>
        <mat-card-subtitle>
          Securely manage your household spending across devices.
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content class="mt-4">
        <form class="flex flex-col gap-3" [formGroup]="form" (ngSubmit)="submit()" aria-label="Authentication form">
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" autocomplete="email" type="email" />
            <mat-error *ngIf="form.controls.email.hasError('required')">Email is required.</mat-error>
            <mat-error *ngIf="form.controls.email.hasError('email')">Enter a valid email.</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input
              matInput
              formControlName="password"
              autocomplete="current-password"
              type="password"
            />
            <mat-error *ngIf="form.controls.password.hasError('required')">Password is required.</mat-error>
            <mat-error *ngIf="form.controls.password.hasError('minlength')">
              Password must be at least 8 characters.
            </mat-error>
          </mat-form-field>

          <p class="min-h-6 text-sm text-red-700" aria-live="polite">{{ feedback() }}</p>

          <button
            mat-flat-button
            color="primary"
            type="submit"
            class="!h-12"
            [disabled]="isSubmitting()"
            aria-label="Submit authentication"
          >
            <span class="inline-flex items-center gap-2">
              <mat-spinner *ngIf="isSubmitting()" diameter="18"></mat-spinner>
              {{ submitLabel() }}
            </span>
          </button>

          @if (supportsPasswordReset()) {
            <button
              mat-button
              type="button"
              class="self-start"
              [disabled]="isSubmitting()"
              (click)="sendPasswordReset()"
              aria-label="Send password reset email"
            >
              Forgot password?
            </button>
          }
        </form>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button type="button" (click)="toggleMode()" aria-label="Switch authentication mode">
          {{ isSignInMode() ? 'Need an account? Sign up' : 'Already have an account? Sign in' }}
        </button>
      </mat-card-actions>
    </mat-card>
  </section>
</main>
